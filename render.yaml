services:
  - type: web
    name: sebb-ai
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_SERVE_STATIC_FILES
        value: true
      # Contact form email — set in Render Dashboard (Environment)
      - key: MAILER_FROM
        sync: false
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: PORT
        value: 10000
    plan: free
    region: oregon
    buildCommand: |
      gem install bundler -v 2.5.11
      bundle install
      bin/rails assets:precompile
    startCommand: bin/rails server -b 0.0.0.0 -p $PORT
    # Custom domain configuration
    customDomains:
      - name: sebb.ai
        type: apex
      - name: www.sebb.ai
        type: subdomain 