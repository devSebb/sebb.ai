about:
  intro_heading: "Hello and welcome, people call me"
  hero_rotating_prefix: "I'm a"
  hero_description: "I design and build digital products. I turn ideas for software and advertising products into reality, a beautiful reality."
  paragraphs:
    - "I'm the kind of person who looks at a blank canvas and immediately starts building — with pixels, code, and caffeine-fueled curiosity. Think of me as a digital Swiss Army knife: part frontend architect, part brand builder, part chaos-into-clarity converter. I like creating things that feel alive — not just functional, but magnetic."
    - "From turning airport Wi-Fi ads into stories people actually stop for, to designing dashboards that make complex data feel effortless, I live at the intersection of design, strategy, and execution. My daily tools? Figma, Framer, Ruby, and a healthy dose of \"let's make this way better than it needs to be.\""
    - "I'm not just a developer — I'm a product thinker who codes, designs, and builds momentum. Whether I'm refining a user journey, leading a small team toward a big vision, or shaping brands from idea to identity, I'm always asking: Can we make this smarter, smoother, and a little more functional?"

