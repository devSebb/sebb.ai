    name: "Billdeck"
    tagline: "Freelancer invoicing & proposals"
    description: "A complete business toolkit for freelancers — manage clients, craft proposals, and generate polished invoices, all in one place."
    detailed_description: "Billdeck takes the chaos out of freelancing. Store client info, create templated proposals, and export professional invoices as PDFs — no spreadsheets, no headaches. Built for the solo operator who wants to look like a studio."
