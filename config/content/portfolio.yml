  - slug: "papayal"
    name: "Papayal"
    tagline: "Gift cards for Ecuador remittances"
    description: "A smarter way to send money home — buy gift cards that work at selected merchants in Ecuador, turning remittances into real value."
    detailed_description: "Papayal tackles a real problem: remittances that get poorly spent. Instead of wiring cash, users purchase curated gift cards accepted at trusted Ecuadorian merchants — groceries, pharmacies, essentials. Money sent actually becomes the things families need."
    hero_image: "projects/Papayal/Mockup_Desktop_1.png"
    gallery:
      - "projects/Papayal/Mockup_Desktop_1.png"
