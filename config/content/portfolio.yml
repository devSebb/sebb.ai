about:
  intro_heading: "Hello and welcome, people call me"
  hero_rotating_prefix: "I'm a"
  hero_tagline: "I design and build digital products that feel alive."
  hero_description: "Software Developer & Designer based in the real world, building for the digital one."
  paragraphs:
    - "I build digital experiences that don't just work — they pull you in. Part designer, part developer, part product thinker who can't resist making things better than they need to be."
    - "I've built consumer apps for travelers, freelancers, and everyday people trying to get things done. I've turned airport Wi-Fi ads into stories worth stopping for, designed dashboards that make complexity feel effortless, and built brands from first sketch to full identity. My work lives at the intersection of design, strategy, and execution — where pixels meet purpose and code becomes experience."
    - "My stack: Figma, Framer, Ruby, React, (aside from the obvious ai stack: Claude, Codex, Weavy and others) and an unhealthy obsession with craft. My approach: treat every project like it deserves to feel alive, not just functional. I lead teams, shape user journeys, and solve problems that sit somewhere between \"this should be simple\" and \"nobody's figured this out yet.\""
    - "If you need someone who designs, codes, and ships — and actually cares whether people love using it — let's talk."

