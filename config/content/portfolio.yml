experience:
  - id: "noria"
    rooms: ["noria"]
    date_label: "January 2026"
    title: "Founder & Principal AI Engineer at Noria"
    summary: "Founded an engineering-led AI implementation studio (noria-tech.com) that installs measurable automation inside client operations — validating ROI before building, then shipping instrumented, production-owned systems on fixed timelines. Shipped production systems for manufacturing, luxury goods, public-company finance, and financial services — from factory-floor planning that replaced a 4-person coordination team to an AI voice agent running thousands of outbound calls."
  - id: "hatchet"
    rooms: ["twitchmetrics", "hatchet"]
    date_label: "November 2025"
    title: "Forward Deployed Engineer at Hatchet"
    summary: "Leading the complete rebuild of twitchmetrics.net, a multi-platform streaming-analytics product, alongside the rebuild and redesign of hatchet.gg — the company's flagship site — from information architecture and visual identity through to front-end delivery. Built the data pipeline that ingests and enriches creator metrics across Twitch, YouTube, TikTok, X, and Kick — background jobs on Inngest, BullMQ, and Redis tracking 32K+ channels. TypeScript monorepo with Next.js 15, tRPC, Prisma, and PostgreSQL."
  - id: "co-founder"
    rooms: ["alias"]
    date_label: "October 2024"
    title: "Founder & Operator — Independent E-Commerce"
    summary: "Build and operate 4 e-commerce stores generating $500K+ in revenue, owning the full stack from storefront to fulfillment. Automated inventory, fulfillment, and customer-success workflows using AI-driven pipelines, scaling order capacity without adding headcount — while maintaining 4.8/5 average customer satisfaction."
  - id: "white-tiger"
    rooms: []
    date_label: "August 2024"
    title: "Software & Product Engineer at White Tiger"
    summary: "Architected and co-developed a React-based analytics dashboard that parsed airport Wi-Fi user-activity data to compute impressions, click-through, and conversion KPIs across campaigns. Led creation of digital and print ads across Italian airport Wi-Fi networks using Figma, Canva, and Framer."

