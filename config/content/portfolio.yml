about:
  intro_heading: "Hello and welcome, people call me"
  hero_rotating_prefix: "I'm a"
  hero_rotating_titles:
    - "Forward Deployed Engineer"
    - "AI Solutions Engineer"
    - "Software Developer"
    - "Product Designer"
    - "Digital Craftsman"
  hero_tagline: "I design and build digital products that feel alive."
  hero_description: "Forward Deployed Engineer & Business Designer — shipping rugged AI powered systems."
  paragraphs:
    - "I build digital experiences that don't just work — they pull you in. Part engineer, part designer, part product thinker who embeds with clients to ship AI systems that reach production and tie to measured outcomes — not pilots or slideware."
    - "I founded Noria, an AI implementation studio that has shipped production systems for factories, public companies, and luxury groups. At Hatchet I'm leading the rebuild of a streaming-analytics platform tracking 32K+ creators, plus the rebuild and redesign of hatchet.gg. Before that: consumer apps for travelers and freelancers, airport Wi-Fi ads worth stopping for, dashboards that make complexity feel effortless, and 4 e-commerce stores doing $500K+ in revenue. My work lives at the intersection of design, strategy, and execution — where pixels meet purpose and code becomes experience."
    - "My stack: TypeScript, Next.js, Ruby, React, Python — plus agent orchestration, RAG, and voice agents with Claude, GPT, and friends — Figma, Framer, and an unhealthy obsession with craft. My approach: treat every project like it deserves to feel alive, not just functional. I lead teams, shape user journeys, and solve problems that sit somewhere between \"this should be simple\" and \"nobody's figured this out yet.\""
    - "If you need someone who designs, codes, and ships — and actually cares whether people love using it — let's talk. Bilingual, English / Spanish."

