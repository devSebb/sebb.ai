    name: "Tripstein"
    tagline: "Real-cost travel budgeting"
    description: "Plan trips with actual prices, not guesses. Tripstein pulls real cost data so you know exactly what your next adventure will cost."
    detailed_description: "Tripstein is for travelers who want honest numbers. Pick a destination, and the app surfaces real pricing data — accommodation, food, transport, activities — so your budget is based on reality, not wishful thinking. No more post-trip financial surprises."
