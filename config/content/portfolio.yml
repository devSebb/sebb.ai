projects:
  - slug: "noria"
    name: "Noria"
    tagline: "AI engineering studio — from linear to exponential"
    description: "My AI implementation studio — custom AI software, agents, and automations built for how companies actually operate, shipped in weeks. AI engineering, not AI theater."
    detailed_description: "Noria is the studio I founded to install measurable AI automation inside real operations — validating ROI before building, then shipping instrumented, production-owned systems on fixed timelines. The work spans a factory-floor production-planning system that replaced a 4-person coordination team (shipped in 8 weeks), a real-time 3D product configurator and consolidated sales dashboard for a luxury group of six subsidiaries, a live ERP–CRM revenue reconciliation sync for a public company, and an AI voice agent running thousands of outbound collections calls."
    additional_paragraphs:
      - "noria-tech.com itself is a fully bilingual (EN/ES) Next.js 16 + React 19 site I designed and built end to end: a scroll-driven narrative with GSAP and Lenis, a hand-written canvas particle flow-field in the hero, and a theme-beacon system that flips the entire palette between dark and light as you scroll. It runs on Tailwind CSS v4 with next-intl for localization."
      - "The booking flow is its own piece of engineering — a three-step demo scheduler backed by a dependency-free, DST-aware timezone slot generator, server-side race guards against double-booking, and a hand-rolled RFC 5545 iCalendar builder that attaches calendar invites to every request. Pure functions, unit-tested with Vitest, no database required."
    hero_image: "projects/Noria/Noria_1.png"
    gallery:
      - "projects/Noria/Noria_1.png"
      - "projects/Noria/Noria_2.png"
      - "projects/Noria/Noria_5.png"
      - "projects/Noria/Noria_3.png"
      - "projects/Noria/Noria_4.png"
    theme_color: "#00E5FF"
    theme_bg: "#0A0A0A"
    year: "2026"
    role: "Founder & Principal AI Engineer"
    status: "live"
    domain: "noria-tech.com"
    link: "https://noria-tech.com"
    features:
      - "Production AI systems for manufacturing, finance, and luxury retail clients"
      - "Validate → Mine → Map → Attack delivery methodology with ROI modeling upfront"
      - "Fully bilingual EN/ES site with locale-aware routing and formatting"
      - "Timezone-aware demo booking engine with DST-correct slot generation"
      - "Canvas particle flow-field hero and scroll-driven dark/light theme switching"
      - "Accessible motion design — reduced-motion support across every animation"
    technologies:
      - "next.js"
      - "typescript"
      - "react"
      - "tailwind"
      - "gsap"

