      - "api"
      - "tailwind"
      - "javascript"

  - slug: "twitchmetrics"
    name: "TwitchMetrics"
    tagline: "Creator analytics platform"
    description: "A unified analytics dashboard for livestreamers — connect your accounts and see all your creator data in one place."
    detailed_description: "TwitchMetrics connects with various social media and streaming platforms to aggregate creator performance data. Built for livestreamers who want to understand their audience, track growth, and make data-driven content decisions — all from a single, clean dashboard."
