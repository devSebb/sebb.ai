about:
  hero_description: "A working exhibition · six rooms · open now"
  hero_line: "I design, build and ship products end to end."
  heading: "Hi, I'm Sebastian."
  paragraphs:
    - "Most people call me Sebb. I design products, write the code, and stay until real people are using them."
    - "I studied finance, learned to code in 2024, and haven't stopped since. Two years on, that's a creator-analytics platform tracking 32K+ channels, a remittance app on both app stores, and Noria, my AI studio, whose systems plan a factory floor and reconcile a public company's revenue."
    - "I do my best work on the messy problems, the ones no template fits. I work in English and Spanish. If you have one of those problems, write to me."

# The three things on offer, each backed by numbers from the rooms.
# `rooms` are project slugs linked as evidence.
practice:
  heading: "Three things I do, with receipts."
  items:
    - title: "Design"
      body: "Brand, interface and motion. I design in the browser as much as in Figma, so what you approve is what ships."
      proofs:
        - ["6", "design systems in this exhibition, none shared"]
        - ["1", "person from first sketch to last hover state"]
      rooms: ["click", "hatchet", "noria"]
    - title: "Engineering"
      body: "TypeScript and Rails, from the data model up. Pipelines, payments, native apps, and the migrations nobody wants to do."
      proofs:
        - ["32K+", "creators tracked across six platforms"]
        - ["2,935", "legacy URLs carried through a rebuild"]
      rooms: ["twitchmetrics", "papayal", "alias"]
    - title: "AI in production"
      body: "Agents, voice and retrieval inside real operations, measured against the work they replace."
      proofs:
        - ["8 weeks", "to automate a four-person planning job"]
        - ["1,000s", "of outbound calls run by a voice agent"]
      rooms: ["noria"]

