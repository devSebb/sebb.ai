experience:
  - id: "white-tiger"
    date_label: "August 2024"
    title: "Product & Digital Designer at White Tiger"
    summary: "Lead creation of digital and print ads across Italian airport Wi-Fi networks using Figma, Canva, and Framer. Architect and co-developed a React-based internal dashboard for parsing airport user-activity data and computing KPIs. Oversee end-to-end project coordination via Notion, managing deadlines, assets, and stakeholder feedback."
  - id: "full-stack"
    date_label: "July 2024"
    title: "Full Stack Developer"
    summary: "Independently developed over six fully functional applications with secure login functionalities. Implemented data safety mechanisms and integrated AI features with GSAP animations. Developed payment gateways and designed modern, responsive user interfaces."
  - id: "co-founder"
    date_label: "January 2023"
    title: "Co-Founder & Operations Lead"
    summary: "Co-founded various high-growth e-commerce brands and assembled a team of over 5 employees to manage them. Managed financial operations, fulfillment structure, and organizational processes across multiple e-commerce stores. Served as primary customer success lead, maintaining 4.8/5 average satisfaction for hundreds of US-based clients."
  - id: "galeria"
    date_label: "May 2020"
    title: "Project Manager at Galeria Shopping"
    summary: "Directed site development for a new retail strip mall, coordinating contractors, sales team, and suppliers. Managed web presence and social media design efforts while leading client and stakeholder meetings. Adapted project plans in real-time amid pandemic-era supply-chain disruptions, preserving timelines and minimizing costs."

